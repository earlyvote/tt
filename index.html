<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block Turnout Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --selected-block: hwb(132 0% 50%);
    --other-block1: lab(51.71% 50.23 26.45);
    --other-block2: hwb(226 26% 18%);
    --other-block3: lch(54.46% 35.43 74.71);
    --other-block4: hsl(298, 43%, 43%);

    --cream: #fdf6ec;
    --ink: #26262a;
    --ink-soft: #54545c;
    --line: #e7e0d3;
    --banner: #4a4a4a;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #fbf8f3;
    font-family: "Inter", system-ui, sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 32px 14px;
  }

  .card {
    width: 100%;
    max-width: 440px;
    background: #ffffff;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
  }

  .pad {
    padding: 22px 22px 4px;
  }

  .pill {
    background: var(--selected-block);
    color: #fff;
    font-family: "Poppins", sans-serif;
    font-weight: 700;
    font-size: 26px;
    line-height: 1.15;
    padding: 16px 20px;
    border-radius: 999px;
    text-align: center;
    margin-bottom: 16px;
  }

  .summary {
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
    color: var(--ink);
    margin-bottom: 16px;
  }

  .summary b {
    font-weight: 700;
  }

  .ev-block {
    padding: 10px 20px 10px;
  }

  .ev-details {
    display: flex;
    align-items: flex-start;
    gap: 0;
  }

  .ev-location {
    flex: 2;
    min-width: 0;
    text-align: left;
    color: var(--ink);
    text-decoration: none;
    display: block;
    border-radius: 8px;
    padding: 4px;
    margin: -4px;
    transition: background-color 0.15s ease;
  }

  .ev-hours-section {
    flex: 3;
    min-width: 0;
    text-align: right;
  }

  .ev-name {
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 10px;
  }

  .ev-address {
    font-weight: 700;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .ev-address-text {
    text-decoration: underline;
  }

  .ev-pin-icon {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    fill: currentColor;
  }

  .ev-hours-label {
    font-weight: 500;
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 0;
  }

  .ev-hours {
    font-size: 14px;
    line-height: 1.5;
  }

  .ev-location:hover {
    background: var(--cream);
  }

  .ev-location:focus-visible {
    outline: 3px solid var(--selected-block);
    outline-offset: 3px;
  }

  @media (max-width: 380px) {
    .ev-details {
      flex-direction: column;
      gap: 16px;
    }

    .ev-location,
    .ev-hours-section {
      width: 100%;
      text-align: center;
    }

    .ev-address {
      justify-content: center;
    }
  }

  .chart-wrap {
    background: var(--cream);
    border-radius: 16px;
    padding: 16px 10px 6px;
    margin-bottom: 16px;
  }

  .chart-wrap svg {
    display: block;
    width: 100%;
    height: auto;
  }

  .ranklist {
    padding: 0 0 14px;
  }

  .rankrow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 6px;
    border-radius: 10px;
    font-size: 15px;
  }

  .rankrow.subject {
    background: var(--selected-block);
    color: #fff;
    font-weight: 700;
  }

  .rankrow .num {
    width: 16px;
    font-weight: 700;
  }

  .rankrow .bname {
    flex: 1;
    font-weight: 600;
  }

  .rankrow .pct {
    font-weight: 700;
  }

  .banner {
    background: var(--banner);
    color: #fff;
    text-align: center;
    font-size: 17px;
    line-height: 1.5;
    padding: 20px;
    font-weight: 500;
  }

  .state {
    padding: 60px 26px;
    text-align: center;
    color: var(--ink-soft);
    font-size: 15px;
    line-height: 1.6;
  }

  .state code {
    background: #f2ede0;
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 13px;
  }

  .spinner {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 3px solid #e6e0d2;
    border-top-color: var(--selected-block);
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>

<body>

    <div class="state">

      Loading block data&hellip;
    </div>

```html
<script>
const CONFIG = {
  urlParam: "block",
  dataDirectory: "data/blocks",
  bannerText: "Get your nextdoor neighbors to vote at your closest early voting location"
};

function _cssVar(name, fallback) {
  const value = getComputedStyle(document.documentElement)
    .getPropertyValue(name);

  return value ? value.trim() : fallback;
}

const COLOR_CONFIG = {
  subject: _cssVar("--selected-block", "#b87421"),
  ranks: [
    _cssVar("--other-block1", "#167f6e"),
    _cssVar("--other-block2", "#2142b8"),
    _cssVar("--other-block3", "#971487"),
    _cssVar("--other-block4", "#e0a35c")
  ]
};

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[character]));
}

function mapUrl(title, address) {
  const location = [title, address].filter(Boolean).join(", ");
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(location)}`;
}

function ordinal(n) {
  const suffixes = ["th", "st", "nd", "rd"];
  const value = n % 100;

  return n + (
    suffixes[(value - 20) % 10]
    || suffixes[value]
    || suffixes[0]
  );
}

function fmtPct(value) {
  const number = Number(value);

  if (!Number.isFinite(number)) {
    return "—";
  }

  return `${(Math.round(number * 10) / 10).toFixed(1)}%`;
}

function showState(html) {
  document.getElementById("card").innerHTML = `
    <div class="state">${html}</div>
  `;
}


/*
  ------------------------------------------------------------
  CONVERT ONE FLAT JSON BLOCK INTO THE SMALL OBJECT USED
  BY THE EXISTING DISPLAY CODE
  ------------------------------------------------------------

  The Python script creates JSON like:

  {
    "block_id": "...",
    "block_plain": "...",
    "pct_voted_current": 12.3,
    "pct_voted_3days": 8.5,
    "pct_voted_1week": 4.2,
    ...
  }

  The website wants:

  {
    id: "...",
    name: "...",
    tc: 12.3,
    t3: 8.5,
    t5: 4.2
  }
*/

function makeDisplayBlock(data, prefix = "") {
  const get = field => {
    return data[`${prefix}${field}`];
  };

  return {
    id: get("id") ?? get("block_id"),
    name: get("name") ?? get("block_plain"),

    // Chart values
    t5: get("pct_voted_1week"),
    t3: get("pct_voted_3days"),
    tc: get("pct_voted_current")
  };
}


/*
  ------------------------------------------------------------
  CONVERT THE JSON FILE INTO:
      subject
      nearbyBlocks

  This is the bridge between the new Python-generated JSON
  and the existing UI.
  ------------------------------------------------------------
*/

function convertPayload(payload) {

  // ----------------------------------------------------------
  // SUBJECT BLOCK
  // ----------------------------------------------------------

  const subject = {
    id: payload.block_id,
    name: payload.block_plain,

    t5: payload.pct_voted_1week,
    t3: payload.pct_voted_3days,
    tc: payload.pct_voted_current,

    isSubject: true,

    // Early voting information
    evTitle: payload.main_ev_name,

    evAddress: [
      payload.main_ev_street_address,
      payload.main_ev_city,
      payload.main_ev_zip
    ].filter(Boolean).join(", "),

    evHours: [
      payload.main_ev_monday_friday
        ? `Mon–Fri: ${payload.main_ev_monday_friday}`
        : null,

      payload.main_ev_sat
        ? `Sat: ${payload.main_ev_sat}`
        : null,

      payload.main_ev_sun
        ? `Sun: ${payload.main_ev_sun}`
        : null
    ].filter(Boolean).join("\n")
  };


  // ----------------------------------------------------------
  // NEARBY BLOCKS
  // ----------------------------------------------------------

  const nearbyBlocks = [];

  for (let i = 1; i <= 4; i++) {

    const id = payload[`nearest_neighbor_${i}_id`];

    // Skip an empty neighbor
    if (!id) {
      continue;
    }

    nearbyBlocks.push({
      id: id,

      name: payload[
        `nearest_neighbor_${i}_plain`
      ],

      t5: payload[
        `nearest_neighbor_${i}_pct_voted_1week`
      ],

      t3: payload[
        `nearest_neighbor_${i}_pct_voted_3days`
      ],

      tc: payload[
        `nearest_neighbor_${i}_pct_voted_current`
      ],

      isSubject: false
    });
  }


  return {
    subject,
    nearbyBlocks
  };
}


function buildChartSVG(combined, colorMap) {
  const W = 380;
  const H = 230;
  const padL = 34;
  const padR = 10;
  const padT = 12;
  const padB = 26;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const MAX_HEADROOM = 1;
  const MIN_HEADROOM = 1;
  const AXIS_ROUND_TO = 1;
  const FORCE_ZERO_FLOOR = false;

  const allValues = combined
    .flatMap(block => [block.t5, block.t3, block.tc])
    .filter(value => Number.isFinite(Number(value)))
    .map(Number);

  if (!allValues.length) {
    return `
      <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <text
          x="${W / 2}"
          y="${H / 2}"
          font-size="14"
          fill="#54545c"
          text-anchor="middle"
          font-family="Inter, sans-serif"
        >No turnout data available</text>
      </svg>
    `;
  }

  const highest = Math.max(...allValues);
  const lowest = Math.min(...allValues);

  let maxVal = Math.ceil(
    (highest + MAX_HEADROOM) / AXIS_ROUND_TO
  ) * AXIS_ROUND_TO;

  let minVal = FORCE_ZERO_FLOOR
    ? 0
    : Math.max(
        0,
        Math.floor(
          (lowest - MIN_HEADROOM) / AXIS_ROUND_TO
        ) * AXIS_ROUND_TO
      );

  if (minVal >= maxVal) {
    minVal = 0;
    maxVal = Math.max(1, highest + 1);
  }

  const gridSteps = 4;

  const yFor = value =>
    padT
    + plotH
    - (
        plotH
        * (Number(value) - minVal)
      )
      / (maxVal - minVal);

  let svg = `
    <svg
      viewBox="0 0 ${W} ${H}"
      xmlns="http://www.w3.org/2000/svg"
    >
  `;

  for (let grid = 0; grid <= gridSteps; grid++) {

    const value =
      minVal
      + ((maxVal - minVal) / gridSteps) * grid;

    const y = yFor(value);

    svg += `
      <line
        x1="${padL}"
        y1="${y}"
        x2="${W - padR}"
        y2="${y}"
        stroke="#e7ded0"
        stroke-width="1"
      />

      <text
        x="${padL - 11}"
        y="${y + 4}"
        font-size="11"
        fill="#8a8577"
        text-anchor="end"
        font-family="Inter, sans-serif"
      >${Math.round(value)}%</text>
    `;
  }

  // The source data has 1 week ago, not 5 days ago.
  const xLabels = [
    "1 week ago",
    "3 days ago",
    "Today"
  ];

  const timeKeys = ["t5", "t3", "tc"];

  const nGroups = timeKeys.length;
  const nBars = combined.length;

  const groupGap = 30;
  const barGap = 3;

  const groupWidth =
    (plotW - groupGap * (nGroups - 1))
    / nGroups;

  const slotWidth =
    (groupWidth - barGap * (nBars - 1))
    / nBars;

  const OTHER_WIDTH_FACTOR = 0.5;

  const baseline = yFor(minVal);

  timeKeys.forEach((key, groupIndex) => {

    const groupX =
      padL
      + groupIndex * (groupWidth + groupGap);

    const groupOrder = [...combined].sort((a, b) => {

      const aValue = Number(a[key]);
      const bValue = Number(b[key]);

      if (
        !Number.isFinite(aValue)
        && !Number.isFinite(bValue)
      ) {
        return 0;
      }

      if (!Number.isFinite(aValue)) {
        return 1;
      }

      if (!Number.isFinite(bValue)) {
        return -1;
      }

      return aValue - bValue;
    });

    const widths = groupOrder.map(block =>
      block.isSubject
        ? slotWidth
        : slotWidth * OTHER_WIDTH_FACTOR
    );

    const rowWidth =
      widths.reduce(
        (sum, width) => sum + width,
        0
      )
      + barGap * (nBars - 1);

    let cursorX =
      groupX
      + (groupWidth - rowWidth) / 2;

    groupOrder.forEach((block, index) => {

      const value = Number(block[key]);
      const hasValue = Number.isFinite(value);

      const barWidth = widths[index];

      if (!hasValue) {
        cursorX += barWidth + barGap;
        return;
      }

      const y = yFor(value);

      const barHeight =
        Math.max(0, baseline - y);

      const color = colorMap[block.id];

      svg += `
        <rect
          x="${cursorX.toFixed(2)}"
          y="${y.toFixed(2)}"
          width="${barWidth.toFixed(2)}"
          height="${barHeight.toFixed(2)}"
          rx="2"
          fill="${color}"
          opacity="${block.isSubject ? 1 : 0.82}"
          stroke="${block.isSubject ? "#26262a" : "none"}"
          stroke-width="${block.isSubject ? 1.5 : 0}"
        />
      `;

      cursorX += barWidth + barGap;
    });

    const groupCenter =
      groupX + groupWidth / 2;

    svg += `
      <text
        x="${groupCenter.toFixed(2)}"
        y="${H - 6}"
        font-size="11"
        fill="#54545c"
        text-anchor="middle"
        font-family="Inter, sans-serif"
        font-weight="600"
      >${xLabels[groupIndex]}</text>
    `;
  });

  svg += "</svg>";

  return svg;
}


function render(
  subject,
  ranked,
  colorMap,
  subjectRank,
  total
) {

  const chartSVG =
    buildChartSVG(ranked, colorMap);

  const rankRows = ranked.map(
    (block, index) => {

      const className =
        block.isSubject
          ? "rankrow subject"
          : "rankrow";

      const color =
        block.isSubject
          ? "#ffffff"
          : colorMap[block.id];

      return `
        <div class="${className}">

          <span
            class="num"
            style="color:${color}"
          >
            ${index + 1}
          </span>

          <span
            class="bname"
            style="color:${color}"
          >
            ${escapeHtml(block.name)}
          </span>

          <span
            class="pct"
            style="color:${color}"
          >
            ${fmtPct(block.tc)}
          </span>

        </div>
      `;
    }
  ).join("");


  document.getElementById("card").innerHTML = `

    <div class="pad">

      <div class="pill">
        ${escapeHtml(subject.name)}
      </div>

      <div class="summary">

        <b>${fmtPct(subject.tc)}</b>
        of your block has voted.

        You are in
        <b>${ordinal(subjectRank)} place</b>
        out of ${total} nearby blocks.

      </div>

      <div class="chart-wrap">
        ${chartSVG}
      </div>

      <div class="ranklist open">
        ${rankRows}
      </div>

    </div>


    <div class="banner">
      ${escapeHtml(CONFIG.bannerText)}
    </div>


    ${
      subject.evTitle
        ? `
          <div class="ev-block">

            <div class="ev-details">

              <a
                class="ev-location"
                href="${mapUrl(
                  subject.evTitle,
                  subject.evAddress
                )}"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open ${escapeHtml(
                  subject.evTitle
                )} in Google Maps"
              >

                <div class="ev-name">
                  ${escapeHtml(subject.evTitle)}
                </div>

                <div class="ev-address">

                  <svg
                    class="ev-pin-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5 1.12 2.5 2.5 2.5z"/>
                  </svg>

                  <span class="ev-address-text">
                    ${escapeHtml(
                      subject.evAddress
                    )}
                  </span>

                </div>

              </a>


              <div class="ev-hours-section">

                <div class="ev-hours">
                  ${escapeHtml(
                    subject.evHours
                  ).replace(/\n/g, "<br>")}
                </div>

              </div>

            </div>

          </div>
        `
        : ""
    }

  `;
}


async function main() {

  // ----------------------------------------------------------
  // GET BLOCK ID FROM URL
  // ----------------------------------------------------------

  const params =
    new URLSearchParams(
      window.location.search
    );

  const rawBlockId =
    params.get(CONFIG.urlParam);


  if (!rawBlockId) {

    showState(`
      No block specified.<br><br>

      Add
      <code>?${CONFIG.urlParam}=YOUR_BLOCK_ID</code>
      to the URL.
    `);

    return;
  }


  /*
    encodeURIComponent is important here.

    It allows IDs containing spaces, hyphens,
    slashes, or other special characters to be
    safely used as filenames/URLs.
  */

  const blockId =
    rawBlockId.trim();

  const jsonUrl =
    `${CONFIG.dataDirectory}/${encodeURIComponent(
      blockId
    )}.json`;


  // ----------------------------------------------------------
  // LOAD ONLY THIS BLOCK'S JSON
  // ----------------------------------------------------------

  let payload;

  try {

    const response =
      await fetch(jsonUrl, {
        cache: "no-cache"
      });


    if (response.status === 404) {

      showState(`
        No block found for ID
        <code>${escapeHtml(blockId)}</code>.
      `);

      return;
    }


    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    payload =
      await response.json();

  } catch (error) {

    showState(`
      Couldn't load block data.<br><br>
      ${escapeHtml(error.message)}
    `);

    return;
  }


  // ----------------------------------------------------------
  // VALIDATE THE JSON
  // ----------------------------------------------------------

  if (
    !payload
    || !payload.block_id
  ) {

    showState(`
      The data file for
      <code>${escapeHtml(blockId)}</code>
      is incomplete or invalid.
    `);

    return;
  }


  // ----------------------------------------------------------
  // CONVERT FLAT JSON INTO DISPLAY OBJECTS
  // ----------------------------------------------------------

  const {
    subject,
    nearbyBlocks
  } = convertPayload(payload);


  // ----------------------------------------------------------
  // COMBINE SUBJECT + FOUR NEIGHBORS
  // ----------------------------------------------------------

  const combined = [
    subject,
    ...nearbyBlocks
  ];


  // Remove duplicates in case a neighbor
  // happens to equal the subject.

  const uniqueBlocks =
    Array.from(
      new Map(
        combined
          .filter(
            block => block && block.id
          )
          .map(
            block => [block.id, block]
          )
      ).values()
    );


  if (uniqueBlocks.length < 2) {

    showState(`
      No nearby-block data found for
      <code>${escapeHtml(blockId)}</code>.
    `);

    return;
  }


  // ----------------------------------------------------------
  // RANK BY CURRENT TURNOUT
  // ----------------------------------------------------------

  const ranked =
    [...uniqueBlocks].sort(
      (a, b) => {

        const aTurnout =
          Number.isFinite(
            Number(a.tc)
          )
            ? Number(a.tc)
            : -Infinity;

        const bTurnout =
          Number.isFinite(
            Number(b.tc)
          )
            ? Number(b.tc)
            : -Infinity;

        return bTurnout - aTurnout;
      }
    );


  // ----------------------------------------------------------
  // ASSIGN COLORS
  // ----------------------------------------------------------

  const colorMap = {};

  let paletteIndex = 0;

  ranked.forEach(block => {

    colorMap[block.id] =
      block.isSubject
        ? COLOR_CONFIG.subject
        : COLOR_CONFIG.ranks[
            paletteIndex++
            % COLOR_CONFIG.ranks.length
          ];

  });


  // ----------------------------------------------------------
  // FIND SUBJECT'S RANK
  // ----------------------------------------------------------

  const subjectRank =
    ranked.findIndex(
      block =>
        block.id === subject.id
    ) + 1;


  // ----------------------------------------------------------
  // RENDER
  // ----------------------------------------------------------

  render(
    subject,
    ranked,
    colorMap,
    subjectRank,
    ranked.length
  );
}


main();
</script>
</body>
</html>
