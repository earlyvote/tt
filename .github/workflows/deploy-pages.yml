name: Build and deploy block turnout tracker

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "data/blocks.csv"
      - "scripts/build-block-json.py"
      - ".github/workflows/deploy-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Pages deployment directory
        run: python scripts/build-block-json.py

      - name: Verify generated files
        run: |
          test -f dist/index.html
          test -d dist/data/blocks
          find dist/data/blocks -name '*.json' -type f | wc -l
          du -sh dist

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4