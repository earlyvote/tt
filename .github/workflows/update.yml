name: Update Block Data

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 10 * * *"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache generated block JSON
        id: cache-blocks
        uses: actions/cache@v4
        with:
          path: build/data/blocks
          key: blocks-${{ hashFiles('data/blocks.csv', 'data/early_voting.csv') }}

      - name: Generate block JSON files
        if: steps.cache-blocks.outputs.cache-hit != 'true'
        run: python scripts/generate_blocks.py

      - name: Copy static site files into build
        run: cp index.html build/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4